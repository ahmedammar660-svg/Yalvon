services:
  - type: web
    name: yalvon360
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --workers 1 is intentional, not a mistake: this app runs a single
    # background thread (start_bulk_refresh_thread in app.py) that
    # refreshes live prices on a timer. Gunicorn's normal multi-worker
    # model spawns a separate OS process per worker, and each process
    # would run its own independent copy of that thread — meaning
    # PSX/CoinGecko/MUFAP would get hit N times instead of once per
    # refresh cycle. --threads handles concurrent requests within the
    # single worker instead, which is enough for personal/small-team use.
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # Optional — only needed if you want live world indices/forex/
      # commodities via Twelve Data instead of the built-in dev values.
      # Add this in the Render dashboard under Environment, not here,
      # so the real key never gets committed to your repo.
      # - key: MARKET_DATA_API_KEY
      #   value: your-key-here
    disk:
      # Free plan does not support persistent disks — this section only
      # takes effect if you upgrade the service to a paid plan. Without
      # it, portfolio.db resets to a fresh empty database every time
      # Render restarts or redeploys the service. See README.md's
      # "Deploying to Render" section for what this means in practice.
    
